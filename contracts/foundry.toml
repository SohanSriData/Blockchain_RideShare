[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
gas_reports = ["*"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 64

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 128 }
